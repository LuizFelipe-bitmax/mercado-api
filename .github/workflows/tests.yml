name: Testes Mercado API

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  testes:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: teste
      ALGORITHM: HS256
      TEMPO_EXPIRACAO: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Criar tabelas
        run: python database/create_tables.py

      - name: Executar testes
        run: pytest